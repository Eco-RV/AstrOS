### ─────────────────────────────────────────────────────────────────────────────
### Scaffold Stellar environments
###
### Which section is used is decided by STELLAR_SCAFFOLD_ENV (set in app/.env).
### This workshop uses TESTNET for `development` because Trustless Work escrows
### only exist on testnet/mainnet (there is no local Trustless Work), and it
### means you don't need Docker. Everything here is free test money.
###
### Agents: read .agents/skills/scaffold-stellar/SKILL.md before editing this.
### ─────────────────────────────────────────────────────────────────────────────

### Development: your contracts are compiled, deployed to TESTNET and get a
### generated TypeScript client every time you save (via `npm start`).
[development.network]
rpc-url = "https://soroban-testnet.stellar.org"
network-passphrase = "Test SDF Network ; September 2015"

[[development.accounts]]
# Keys for this account are created (and funded by friendbot) automatically and
# saved under app/.config/stellar/identity (gitignored). It's the deployer, NOT
# your browser wallet.
name = "me"
default = true

[development.contracts]
# POAP-style attendance badges (contracts/attendance). `admin` can only upgrade the code.
attendance = { client = true, constructor_args = "--admin me" }
# `client = true` means: build -> deploy -> generate a TS client you can import as
#   import { reputation } from "@stellar-scaffold/app-lib/clients"
# The key must be the snake_case version of the crate `name` in its Cargo.toml.
reputation = { client = true }

# OpenZeppelin examples that ship with Scaffold: compiled as references but NOT
# deployed. Scaffold tries to deploy every crate in contracts/, so any contract you
# don't want deployed must be listed with `client = false`.
fungible_allowlist_example = { client = false }
nft_enumerable_example = { client = false }
# To deploy them (e.g. "mint an NFT badge when an escrow is released"), use instead:
# fungible_allowlist_example = { client = true, constructor_args = "--name ExampleToken --symbol EXT --admin me --manager me --initial_supply 1000000000000000000000000" }
# nft_enumerable_example = { client = true, constructor_args = "--uri https://example.com/nft/ --name ExampleNFT --symbol ENFT --owner me" }

# Full syntax for a contract with a constructor and post-deploy calls:
# [development.contracts.my_contract]
# client = true
# constructor_args = """
# --admin me
# """
# # Each line is the part after `--` in `stellar contract invoke --id <this> --source me --`
# after_deploy = """
# set_fee --fee 100
# """

### Staging (AstrOS): fixed contracts on TESTNET used by `dev_main` and the
### Vercel Previews. Deployed once by `astros-admin` (app/.config/stellar, local
### only) and updated with `upgrade`, never redeployed: a new deploy starts with
### empty data. See docs/FLUJO.md and Versionamiento/.
[staging.network]
rpc-url = "https://soroban-testnet.stellar.org"
network-passphrase = "Test SDF Network ; September 2015"

[[staging.accounts]]
name = "astros-admin"
default = true

[staging.contracts]
attendance = { id = "CBYKEFCNBPQW3G2XABSKYBOGV4VAOS7QPXM3QEUXVH4T4CZECC72YSAU" }
reputation = { id = "CAIDTMGHVR2NG33A32AGALDFCXQS4JKF5DVJNMOSSP2C4TGRJ55RYDUI" }
fungible_allowlist_example = { client = false }
nft_enumerable_example = { client = false }

