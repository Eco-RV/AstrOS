[package]
name = "attendance"
description = "Proof-of-attendance badges (POAP-style): events and personal, non-transferable badges"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
version.workspace = true

[package.metadata.stellar]
cargo_inherit = true

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Signs rotating-QR codes in tests (same version soroban-sdk already uses).
ed25519-dalek = "2.1.1"
